<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Game - Pedra, Papel ou Tesoura</title>
    <link rel="stylesheet" href="game.css">
</head>
<body>

    <div class="container">
        <h1>Pedra, Papel ou Tesoura</h1>
        <p class="instrucao">Faça a sua escolha para jogar contra o Computador:</p>

        <!-- FASE A: O usuário faz uma escolha clicando nos botões -->
        <div class="botoes">
            <button onclick="jogar('pedra')">✊ Pedra</button>
            <button onclick="jogar('papel')">✋ Papel</button>
            <button onclick="jogar('tesoura')">✌️ Tesoura</button>
        </div>

        <div class="placar">
            <div class="escolhas">
                <p>Você: <span id="escolha-usuario">-</span></p>
                <p>Computador: <span id="escolha-computador">-</span></p>
            </div>
            <hr>
            <div class="resultado" id="resultado-final">Quem vencerá?</div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
